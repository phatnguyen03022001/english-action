name: Python Content Quality Engine

on:
  push:
    branches: [main]
    paths:
      - 'english_action/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-quality.yml'
      - '.github/workflows/reusable-python-quality.yml'
      - '.github/workflows/reusable-spec-validation.yml'
      - '.github/workflows/central-private-ci.yml'
      - '.github/ci/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'QUALITY_ENGINE.md'
  pull_request:
    paths:
      - 'english_action/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-quality.yml'
      - '.github/workflows/reusable-python-quality.yml'
      - '.github/workflows/reusable-spec-validation.yml'
      - '.github/workflows/central-private-ci.yml'
      - '.github/ci/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'QUALITY_ENGINE.md'

permissions:
  contents: read

jobs:
  synthetic-quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install engine
        run: python -m pip install --disable-pip-version-check .
      - name: Install pinned test coverage instrumentation
        run: python -m pip install --disable-pip-version-check coverage==7.17.0
      - name: Run public synthetic tests with measured line and branch coverage
        run: |
          python -m coverage run --branch --source=english_action -m unittest discover -s tests -v
          python -m coverage report -m
      - name: Run public synthetic specification validator smoke
        run: python -m english_action.spec_validate --root tests/fixtures/spec-validation

  central-ci-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public central CI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify pagination, per-SHA recovery, attribution and isolation
        run: python -m unittest discover -s .github/ci -p 'test_*.py' -v
      - name: Validate migrated shell and all workflow syntax
        run: |
          bash -n .github/ci/spawn-gate.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  central-private-verification:
    if: github.event_name == 'push'
    needs: central-ci-contract-tests
    uses: ./.github/workflows/central-private-ci.yml
    # T01 recovery: reproduce the exact inherited failure; remove after diagnosis.
    with:
      source_repository: english-content
      source_sha: bc5aa7ea443ae0d5ab76c98e169b58fd1e24b8fc
    secrets:
      english: ${{ secrets.english }}
