name: Reusable Gate 2 Specification Validation

on:
  workflow_call:
    inputs:
      validator_sha:
        description: Full immutable commit SHA of the public validator (same as workflow uses pin)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-specifications:
    name: Validate caller feature specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout triggering caller revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Checkout immutable public validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: phatnguyen03022001/english-action
          ref: ${{ inputs.validator_sha }}
          path: .spec-validator-src
          persist-credentials: false
      - name: Verify checkout identities and install public validator
        env:
          VALIDATOR_SHA: ${{ inputs.validator_sha }}
        run: |
          set -euo pipefail
          [[ "$VALIDATOR_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .spec-validator-src rev-parse HEAD)" = "$VALIDATOR_SHA"
          python -m pip install --disable-pip-version-check --no-input ./.spec-validator-src
      - name: Validate caller repository without changing files
        run: python -m english_action.spec_validate --root "$GITHUB_WORKSPACE"
