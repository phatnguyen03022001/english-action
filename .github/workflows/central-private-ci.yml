name: Central Private Repository CI

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      source_repository:
        description: Catch up both repositories, or verify one exact repository
        type: choice
        options: [all, english, english-content]
        default: all
      source_sha:
        description: Optional full lowercase 40-character SHA; requires one repository
        type: string
        required: false
  # Bootstrap and verify central changes from the existing public CI only.
  workflow_call:
    inputs:
      source_repository:
        type: string
        default: all
      source_sha:
        type: string
        default: ''
    secrets:
      CI_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  verify-private-revisions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact central workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require actual cross-repository credentials
        env:
          CLIENT_ID: ${{ vars.CI_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$CLIENT_ID" || -z "$APP_KEY" ]]; then
            echo 'BLOCKED: configure CI_APP_CLIENT_ID variable and CI_APP_PRIVATE_KEY secret in english-action.'
            exit 2
          fi
      - name: Mint narrowly scoped installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: phatnguyen03022001
          repositories: english,english-content
          permission-contents: read
          permission-statuses: write
      - name: Catch up immutable private revisions and publish attributable statuses
        env:
          CI_APP_TOKEN: ${{ steps.app.outputs.token }}
          CI_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository || 'all' }}
          SOURCE_SHA: ${{ inputs.source_sha || '' }}
        run: python .github/ci/central_ci.py
